<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CEP Local DLP Status</title>
  <style>
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .online {
      background: #dcfce7;
      color: #15803d;
    }
    .offline {
      background: #fee2e2;
      color: #b91c1c;
    }
    .meta {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .meta-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #64748b;
    }
    .value {
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .toast {
      font-size: 11.5px;
      line-height: 1.45;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .toast-info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .toast-warn {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .toast-success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      background: #f1f5f9;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .btn-primary {
      background: #1a73e8;
      color: #ffffff;
      border-color: #1a73e8;
    }
    .btn-primary:hover {
      background: #1557b0;
    }
    .btn-full {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">CEP Local DLP Companion</span>
    <span id="status-badge" class="badge offline">未接続</span>
  </div>

  <div class="meta">
    <div class="meta-row">
      <span class="label">ローカル待受</span>
      <span class="value">127.0.0.1:8843</span>
    </div>
    <div class="meta-row">
      <span class="label">DM トークン</span>
      <span id="token-status" class="value">確認中...</span>
    </div>
    <div class="meta-row">
      <span class="label">ホスト / バージョン</span>
      <span id="pid-status" class="value">-</span>
    </div>
  </div>

  <div id="popup-toast" class="toast toast-info" hidden></div>

  <div class="actions">
    <button id="btn-recheck" class="btn" type="button">🔄 再確認</button>
    <button id="btn-start" class="btn btn-primary" type="button">🚀 エージェント起動</button>
  </div>
  <button id="btn-setup" class="btn btn-full" type="button">
    ⚙️ 初回セットアップ・設定画面を開く
  </button>

  <script src="popup.js"></script>
</body>
</html>
